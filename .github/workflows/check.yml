name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate every skill's structure
        run: node scripts/check-skills.js
